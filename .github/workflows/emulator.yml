name: Browser emulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Install font tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libraqm0 fonts-dejavu-core
          pip install pillow numpy
      - name: Build the WebAssembly emulator
        working-directory: platform/fm1-base
        run: python3 tools/build.py ../.. --web
      - name: Prepare the site
        run: |
          mkdir -p _site
          cp -r build/emu/. _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
